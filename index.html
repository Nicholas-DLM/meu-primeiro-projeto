<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora elétrica</title>
  <link rel="stylesheet" href="style.css">
</head>

  <body>
  <h1>Calculadora elétrica</h1>

  <p>Descubra a corrente de uma carga usando potência e tensão.</p>
    <label for="tipoCircuito">Tipo de circuito:</label>
    <select id="tipoCircuito">
      <option value="monofasico">Monofásico (fase-neutro)</option>
      <option value="bifasico">Bifásico (carga entre duas fases)</option>
      <option value="trifasico">Trifásico equilibrado (tensão entre fases)</option>
    </select>
    <p>No modo trifásico, informe a tensão entre fases.</p>

  <label for="potencia">Potência (W):</label>
  <input id="potencia" type="number">

  <label for="tensao">Tensão (V):</label>
  <input id="tensao" type="number">
  <label for="fatorPotencia">Fator de potência (0 a 1):</label>
<input id="fatorPotencia" type="number" min="0.01" max="1" step="0.01" value="1">

<button id="calcular">Calcular corrente</button>
<button id="limpar">Limpar</button>
<p id="resultado">O resultado aparecerá aqui.</p>

<script>
  const botao = document.getElementById("calcular");
  const botaoLimpar = document.getElementById("limpar");

  botao.addEventListener("click", function () {
    const potencia = Number(document.getElementById("potencia").value);
    const tensao = Number(document.getElementById("tensao").value);
    const fatorPotencia = Number(document.getElementById("fatorPotencia").value);
    const tipoCircuito = document.getElementById("tipoCircuito").value;
    const resultado = document.getElementById("resultado");

    if (potencia <= 0 || tensao <= 0 || fatorPotencia <= 0 || fatorPotencia > 1) {
      resultado.textContent = "Digite potência e tensão maiores que zero e fator de potência entre 0 e 1.";
      return;
    }

    let corrente;
let formula;

if (tipoCircuito === "trifasico") {
  corrente = potencia / (Math.sqrt(3) * tensao * fatorPotencia);
  formula = `I = ${potencia} W / (√3 × ${tensao} V × ${fatorPotencia})`;
} else {
  corrente = potencia / (tensao * fatorPotencia);
  formula = `I = ${potencia} W / (${tensao} V × ${fatorPotencia})`;
}

resultado.textContent = `Corrente: ${corrente.toFixed(2)} A (${formula})`;
  });

  botaoLimpar.addEventListener("click", function () {
  document.getElementById("potencia").value = "";
  document.getElementById("tensao").value = "";
  document.getElementById("fatorPotencia").value = "1";
  document.getElementById("tipoCircuito").value = "monofasico";
  document.getElementById("resultado").textContent = "O resultado aparecerá aqui.";
});
</script>
</body>
</html>
